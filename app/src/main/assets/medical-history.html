<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedVault - Medical Records with Cloud Sync</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          -webkit-tap-highlight-color: transparent;
        }

        :root {
          --primary: #00a8a8;
          --primary-dark: #007f7f;
          --secondary: #ff6b6b;
          --bg: #0a1929;
          --bg-light: #132f4c;
          --bg-card: #1a3a52;
          --text: #e3f2fd;
          --text-dim: #90caf9;
          --border: #2e5266;
          --success: #4caf50;
          --warning: #ff9800;
        }

        body {
          font-family: 'IBM Plex Mono', monospace;
          background: var(--bg);
          color: var(--text);
          min-height: 100vh;
          background-image:
            radial-gradient(circle at 20% 50%, rgba(0, 168, 168, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(255, 107, 107, 0.08) 0%, transparent 50%);
          overflow-x: hidden;
        }

        .container {
          max-width: 100%;
          margin: 0 auto;
          padding: 1rem;
        }

        header {
          text-align: center;
          margin-bottom: 1.5rem;
          padding: 1.5rem 0;
          border-bottom: 2px solid var(--border);
          position: relative;
        }

        h1 {
          font-family: 'Syne', sans-serif;
          font-size: 2rem;
          font-weight: 700;
          letter-spacing: -2px;
          background: linear-gradient(135deg, var(--primary), var(--secondary));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          margin-bottom: 0.5rem;
          animation: slideDown 0.6s ease;
        }

        .subtitle {
          font-size: 0.75rem;
          color: var(--text-dim);
          text-transform: uppercase;
          letter-spacing: 2px;
          animation: fadeIn 0.8s ease 0.2s both;
        }

        .sync-status {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.5rem;
          margin-top: 0.5rem;
          font-size: 0.7rem;
          color: var(--text-dim);
        }

        .sync-indicator {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--text-dim);
        }

        .sync-indicator.synced {
          background: var(--success);
        }

        .sync-indicator.syncing {
          background: var(--warning);
          animation: pulse 1s infinite;
        }

        .sync-indicator.offline {
          background: var(--secondary);
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }

        .login-container {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          padding: 1rem;
        }

        .login-box {
          background: var(--bg-card);
          padding: 2rem;
          border-radius: 12px;
          border: 1px solid var(--border);
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
          max-width: 400px;
          width: 100%;
          animation: fadeSlideUp 0.6s ease;
        }

        .login-error, .success-message, .warning-message {
          padding: 0.75rem;
          border-radius: 6px;
          margin-bottom: 1rem;
          font-size: 0.85rem;
          display: none;
          animation: fadeSlideUp 0.4s ease;
        }

        .login-error {
          background: rgba(255, 107, 107, 0.2);
          color: var(--secondary);
          border: 1px solid var(--secondary);
        }

        .success-message {
          background: rgba(76, 175, 80, 0.2);
          color: var(--success);
          border: 1px solid var(--success);
        }

        .warning-message {
          background: rgba(255, 152, 0, 0.2);
          color: var(--warning);
          border: 1px solid var(--warning);
        }

        .login-error.show, .success-message.show, .warning-message.show {
          display: block;
        }

        .search-section {
          margin-bottom: 1.5rem;
          animation: fadeIn 0.8s ease 0.6s both;
        }

        .search-box {
          background: var(--bg-card);
          padding: 1rem;
          border-radius: 12px;
          border: 1px solid var(--border);
          display: flex;
          gap: 0.5rem;
          flex-wrap: wrap;
          align-items: center;
        }

        .search-box input {
          flex: 1;
          min-width: 150px;
        }

        .form-group {
          display: flex;
          flex-direction: column;
          margin-bottom: 1rem;
          position: relative;
        }

        label {
          font-size: 0.7rem;
          text-transform: uppercase;
          letter-spacing: 1px;
          color: var(--text-dim);
          margin-bottom: 0.5rem;
          font-weight: 500;
        }

        input, textarea, select {
          padding: 0.75rem;
          background: var(--bg-light);
          border: 1px solid var(--border);
          border-radius: 6px;
          color: var(--text);
          font-family: 'IBM Plex Mono', monospace;
          font-size: 0.85rem;
          transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
          outline: none;
          border-color: var(--primary);
          box-shadow: 0 0 0 3px rgba(0, 168, 168, 0.1);
        }

        textarea {
          resize: vertical;
          min-height: 80px;
        }

        .btn {
          padding: 0.75rem 1.5rem;
          border: none;
          border-radius: 6px;
          font-family: 'Syne', sans-serif;
          font-size: 0.85rem;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s ease;
          text-transform: uppercase;
          letter-spacing: 1px;
        }

        .btn-primary {
          background: var(--primary);
          color: white;
        }

        .btn-primary:active {
          background: var(--primary-dark);
          transform: translateY(0);
        }

        .btn-secondary {
          background: var(--secondary);
          color: white;
        }

        .btn-secondary:active {
          background: #ff5252;
          transform: translateY(0);
        }

        .btn-success {
          background: var(--success);
          color: white;
        }

        .btn-success:active {
          background: #388e3c;
          transform: translateY(0);
        }

        .btn-small {
          padding: 0.5rem 1rem;
          font-size: 0.7rem;
        }

        .voice-btn {
          position: absolute;
          right: 10px;
          top: 50%;
          transform: translateY(-50%);
          background: var(--primary);
          color: white;
          border: none;
          border-radius: 50%;
          width: 36px;
          height: 36px;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.2rem;
          transition: all 0.3s ease;
        }

        .voice-btn:hover {
          background: var(--primary-dark);
        }

        .voice-btn.listening {
          background: var(--secondary);
          animation: pulse 1s infinite;
        }

        .input-with-voice {
          position: relative;
        }

        .input-with-voice input,
        .input-with-voice textarea {
          padding-right: 50px;
        }

        .modal {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.8);
          z-index: 1000;
          overflow-y: auto;
          padding: 1rem;
        }

        .modal.show {
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .modal-content {
          background: var(--bg-card);
          padding: 2rem;
          border-radius: 12px;
          border: 1px solid var(--border);
          max-width: 600px;
          width: 100%;
          max-height: 90vh;
          overflow-y: auto;
          animation: fadeSlideUp 0.3s ease;
        }

        .modal-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1.5rem;
        }

        .modal-title {
          font-family: 'Syne', sans-serif;
          font-size: 1.5rem;
          color: var(--primary);
        }

        .close-btn {
          background: none;
          border: none;
          color: var(--text);
          font-size: 2rem;
          cursor: pointer;
          line-height: 1;
          padding: 0;
          width: 32px;
          height: 32px;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          background: var(--bg-card);
          border-radius: 12px;
          overflow: hidden;
          border: 1px solid var(--border);
        }

        thead {
          background: var(--bg-light);
        }

        th {
          padding: 1rem;
          text-align: left;
          font-size: 0.7rem;
          text-transform: uppercase;
          letter-spacing: 1px;
          color: var(--text-dim);
          font-weight: 600;
          border-bottom: 2px solid var(--border);
        }

        td {
          padding: 1rem;
          border-bottom: 1px solid var(--border);
          font-size: 0.85rem;
          color: var(--text);
        }

        tr:hover {
          background: rgba(0, 168, 168, 0.05);
        }

        tr:last-child td {
          border-bottom: none;
        }

        .empty-state {
          text-align: center;
          padding: 3rem 1rem;
          color: var(--text-dim);
        }

        .actions-cell {
          display: flex;
          gap: 0.5rem;
          flex-wrap: wrap;
        }

        .record-row:hover {
          background: rgba(0, 168, 168, 0.08);
        }

        .detail-field {
          display: flex;
          flex-direction: column;
          gap: 0.25rem;
          padding: 0.75rem;
          background: var(--bg-light);
          border: 1px solid var(--border);
          border-radius: 6px;
        }

        .detail-field-label {
          font-size: 0.65rem;
          color: var(--text-dim);
          text-transform: uppercase;
          letter-spacing: 1.5px;
        }

        .detail-field-value {
          font-size: 0.9rem;
          color: var(--text);
          word-break: break-word;
        }

        @keyframes slideDown {
          from {
            opacity: 0;
            transform: translateY(-30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes fadeIn {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }

        @keyframes fadeSlideUp {
          from {
            opacity: 0;
            transform: translateY(20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-10px); }
          75% { transform: translateX(10px); }
        }

        @media (max-width: 768px) {
          table {
            font-size: 0.75rem;
          }

          th, td {
            padding: 0.75rem 0.5rem;
          }

          th {
            font-size: 0.65rem;
          }

          .search-box {
            flex-direction: column;
          }

          .search-box input,
          .search-box button {
            width: 100%;
          }

          .actions-cell {
            flex-direction: column;
          }
        }

        .autocomplete-container {
          position: relative;
          width: 100%;
        }

        .autocomplete-suggestions {
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-top: none;
          border-radius: 0 0 8px 8px;
          max-height: 200px;
          overflow-y: auto;
          z-index: 1000;
          display: none;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .autocomplete-suggestions.show {
          display: block;
        }

        .autocomplete-suggestion {
          padding: 0.75rem 1rem;
          cursor: pointer;
          transition: background 0.2s;
          border-bottom: 1px solid var(--border);
        }

        .autocomplete-suggestion:last-child {
          border-bottom: none;
        }

        .autocomplete-suggestion:hover {
          background: var(--primary);
          color: white;
        }

        .autocomplete-suggestion.selected {
          background: var(--primary);
          color: white;
        }

        .autocomplete-match {
          font-weight: bold;
          color: var(--primary);
        }

        .autocomplete-suggestion:hover .autocomplete-match {
          color: white;
        }

        .autocomplete-category {
          font-size: 0.75rem;
          color: var(--text-secondary);
          margin-top: 0.25rem;
        }
    </style>

    <!-- Reports and Status Features CSS -->
    <link rel="stylesheet" href="reports-status.css">
</head>
<body>
<!-- Login Screen -->
<div id="login-screen" class="login-container">
    <div class="login-box">
        <h1 style="margin-bottom: 0.5rem;">MedVault</h1>
        <p class="subtitle" style="margin-bottom: 2rem;">Secure Medical Records</p>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="login-name" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>PIN</label>
            <input type="password" id="login-pin" placeholder="Enter 6-digit PIN" maxlength="6">
        </div>

        <div id="login-error" class="login-error"></div>

        <button class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;" onclick="login()">Login</button>

        <div style="text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 1rem;">
            ☁️ Multi-user sync via Google Drive<br>
            🎤 Voice input support
        </div>
    </div>
</div>

<!-- Main App -->
<div class="container" id="main-app" style="display: none;">
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem;">
            <div style="flex: 1;">
                <h1>MedVault</h1>
                <p class="subtitle">Patient Records System</p>
            </div>
            <button class="btn btn-secondary btn-small" onclick="logout()">Logout</button>
        </div>
        <div id="user-info" style="text-align: center; color: var(--text-dim); font-size: 0.8rem;"></div>

        <div class="sync-status">
            <span class="sync-indicator" id="sync-indicator"></span>
            <span id="sync-text">Checking sync status...</span>
            <button class="btn btn-success btn-small" onclick="manualSync()" id="sync-btn" style="margin-left: 0.5rem;">
                ☁️ Sync Now
            </button>
        </div>
    </header>

    <!-- Messages -->
    <div id="success-message" class="success-message"></div>
    <div id="warning-message" class="warning-message"></div>

    <!-- Search Bar and Add Button -->
    <div class="search-section">
        <div class="search-box" style="gap: 0.5rem;">
            <input type="text" id="search-input" placeholder="Search by name, ID, or phone (partial match supported)..." style="flex: 1; min-width: 200px; margin-right: 0.5rem;">
            <button class="btn btn-primary btn-small" onclick="searchRecords()">Search</button>
            <button class="btn btn-secondary btn-small" onclick="clearSearch()">Show All</button>
            <div style="flex: 1;"></div>
            <button class="btn btn-primary btn-small" onclick="showAddForm()" style="white-space: nowrap;">+ Add Patient Record</button>
        </div>
    </div>

    <!-- Patient Records Table -->
    <div style="overflow-x: auto;">
        <table id="records-table">
            <thead>
            <tr>
                <th style="width: 60px;"></th>
                <th>PATIENT NAME</th>
                <th>PHONE NUMBER</th>
                <th>DATE OF VISIT</th>
                <th style="width: 100px;">ACTIONS</th>
            </tr>
            </thead>
            <tbody id="records-body">
            <tr>
                <td colspan="5" class="empty-state">No records found</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Patient Record Modal -->
<div id="patient-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="modal-title">Add Patient Record</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>

        <form id="patient-form" onsubmit="savePatientRecord(event)">
            <div class="form-group">
                <label>Patient Name <span style="color: var(--secondary);">*</span></label>
                <div class="input-with-voice">
                    <input type="text" id="patient-name" placeholder="e.g., John Doe" required list="patient-names-list">
                    <button type="button" class="voice-btn" onclick="startVoiceInput('patient-name')" title="Voice input">🎤</button>
                </div>
                <datalist id="patient-names-list"></datalist>
            </div>

            <div class="form-group">
                <label>Phone Number <span style="color: var(--secondary);">*</span></label>
                <input type="tel" id="phone-number" placeholder="e.g., 9876543210" required pattern="[0-9]{10}" maxlength="10">
            </div>

            <div class="form-group">
                <label>Date of Visit <span style="color: var(--secondary);">*</span></label>
                <input type="date" id="date-of-visit" required>
            </div>

            <div class="form-group">
                <label>Diagnosis <span style="color: var(--secondary);">*</span></label>
                <div class="input-with-voice">
                    <div class="autocomplete-container">
                        <textarea id="diagnosis" placeholder="Speak or type diagnosis details..." required></textarea>
                        <div id="diagnosis-suggestions" class="autocomplete-suggestions"></div>
                    </div>
                    <button type="button" class="voice-btn" onclick="startVoiceInput('diagnosis')" title="Voice input" style="top: 20px;">🎤</button>
                </div>
            </div>

            <div class="form-group">
                <label>Medicines <span style="font-size: 0.75rem; color: var(--text-dim);">(Optional)</span></label>
                <div class="input-with-voice">
                    <textarea id="medicines" placeholder="Speak or type prescribed medicines (optional)..."></textarea>
                    <button type="button" class="voice-btn" onclick="startVoiceInput('medicines')" title="Voice input" style="top: 20px;">🎤</button>
                </div>
            </div>

            <div class="form-group">
                <label>Reports <span style="font-size: 0.75rem; color: var(--text-dim);">(Optional)</span></label>
                <div class="file-upload-container">
                    <input type="file" id="reports-input" multiple accept="image/*,.pdf,.doc,.docx" style="display: none;" onchange="handleFileSelect(event)">
                    <button type="button" class="file-upload-btn" onclick="document.getElementById('reports-input').click()">
                        📎 Add Reports
                    </button>
                    <div id="file-list" class="file-list"></div>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Record</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Patient Detail View Modal -->
<div id="detail-modal" class="modal" onclick="if(event.target===this)closeDetailModal()">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">Patient Details</h2>
            <button class="close-btn" onclick="closeDetailModal()">&times;</button>
        </div>
        <div id="detail-body" style="display: flex; flex-direction: column; gap: 1rem; padding-top: 0.5rem;"></div>
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button id="detail-edit-btn" class="btn btn-primary" style="flex: 1;">Edit</button>
            <button class="btn btn-secondary" onclick="closeDetailModal()" style="flex: 1;">Close</button>
        </div>
    </div>
</div>

<!-- Reports and Status Features JavaScript - MUST LOAD FIRST THIS. -->
<script src="reports-status.js"></script>

<script>
    // Wait for reports-status.js to load before defining other functions
    window.addEventListener('DOMContentLoaded', function() {
      // Check if external functions are loaded
      if (typeof clearSelectedFiles === 'undefined') {
        console.error('reports-status.js did not load properly!');
        alert('Error: External scripts not loaded. Please ensure reports-status.js is in the same folder.');
      }
    });

    // Storage adapters
    const storage = {
      async set(key, value) {
        try {
          if (typeof AndroidStorage !== 'undefined') {
            AndroidStorage.setItem(key, value);
            return { key, value };
          } else {
            localStorage.setItem(key, value);
            return { key, value };
          }
        } catch (e) {
          console.error('Storage set error:', e);
          throw e;
        }
      },

      async get(key) {
        try {
          let value;
          if (typeof AndroidStorage !== 'undefined') {
            value = AndroidStorage.getItem(key);
          } else {
            value = localStorage.getItem(key);
          }
          return value ? { key, value } : null;
        } catch (e) {
          console.error('Storage get error:', e);
          return null;
        }
      },

      async delete(key) {
        try {
          if (typeof AndroidStorage !== 'undefined') {
            AndroidStorage.removeItem(key);
          } else {
            localStorage.removeItem(key);
          }
          return { key, deleted: true };
        } catch (e) {
          console.error('Storage delete error:', e);
          throw e;
        }
      }
    };

    window.storage = storage;

    // Voice Recognition Setup
    let recognition = null;
    let currentVoiceField = null;

    function initVoiceRecognition() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          if (currentVoiceField) {
            const field = document.getElementById(currentVoiceField);
            if (field) {
              field.value = field.value ? field.value + ' ' + transcript : transcript;
            }
          }
          stopVoiceInput();
        };

        recognition.onerror = function(event) {
          console.error('Speech recognition error:', event.error);
          showWarningMessage('Voice input error: ' + event.error);
          stopVoiceInput();
        };

        recognition.onend = function() {
          stopVoiceInput();
        };
      }
    }

    function startVoiceInput(fieldId) {
      if (!recognition) {
        showWarningMessage('Voice input not supported in this browser');
        return;
      }

      currentVoiceField = fieldId;
      const voiceBtn = event.target;
      voiceBtn.classList.add('listening');
      voiceBtn.textContent = '🔴';

      try {
        recognition.start();
      } catch (e) {
        console.error('Recognition start error:', e);
        stopVoiceInput();
      }
    }

    function stopVoiceInput() {
      if (recognition) {
        try {
          recognition.stop();
        } catch (e) {
          // Already stopped
        }
      }

      document.querySelectorAll('.voice-btn').forEach(btn => {
        btn.classList.remove('listening');
        btn.textContent = '🎤';
      });

      currentVoiceField = null;
    }

    // Google Drive interface
    const GoogleDriveSync = {
      isSignedIn() {
        if (typeof GoogleDrive !== 'undefined') {
          return GoogleDrive.isSignedIn();
        }
        return false;
      },

      signIn() {
        if (typeof GoogleDrive !== 'undefined') {
          GoogleDrive.signIn();
        } else {
          showWarningMessage('Google Drive not available in web version');
        }
      },

      async uploadData() {
        const allData = {
          records: await loadData('patient-records'),
          patientMap: await loadData('patient-id-map'),
          lastSync: new Date().toISOString()
        };

        const dataJson = JSON.stringify(allData).replace(/"/g, '\\"');

        if (typeof GoogleDrive !== 'undefined') {
          updateSyncStatus('syncing', 'Uploading to Google Drive...');
          GoogleDrive.syncToCloud(dataJson);
        } else {
          console.log('Would upload:', allData);
          showWarningMessage('Running in web mode - data saved locally only');
        }
      },

      async downloadData() {
        if (typeof GoogleDrive !== 'undefined') {
          updateSyncStatus('syncing', 'Downloading from Google Drive...');
          GoogleDrive.syncFromCloud();
        }
      }
    };

    // Callbacks from native code
    window.onDriveReady = function(isReady) {
      if (isReady) {
        updateSyncStatus('synced', 'Google Drive connected');
        showSuccessMessage('✓ Connected to Google Drive');
      } else {
        updateSyncStatus('offline', 'Not connected to Drive');
      }
    };

    window.onSyncComplete = function(success, message) {
      if (success) {
        updateSyncStatus('synced', 'Last synced: just now');
        showSuccessMessage('✓ ' + message);
      } else {
        updateSyncStatus('offline', 'Sync failed');
        showWarningMessage('⚠ ' + message);
      }
    };

    window.onDataReceived = function(dataJson) {
      try {
        const data = JSON.parse(dataJson);
        mergeData(data);
        updateSyncStatus('synced', 'Synced successfully');
        showSuccessMessage('✓ Data synced from Google Drive');
        loadRecords();
      } catch (e) {
        console.error('Error processing remote data:', e);
        showWarningMessage('⚠ Error syncing data');
      }
    };

    async function mergeData(remoteData) {
      const localRecords = await loadData('patient-records');
      const remoteRecords = remoteData.records || [];
      const mergedRecords = [...localRecords];

      remoteRecords.forEach(remoteRecord => {
        const existingIndex = mergedRecords.findIndex(r => r.id === remoteRecord.id);
        if (existingIndex === -1) {
          mergedRecords.push(remoteRecord);
        } else {
          if (new Date(remoteRecord.timestamp) > new Date(mergedRecords[existingIndex].timestamp)) {
            mergedRecords[existingIndex] = remoteRecord;
          }
        }
      });

      await saveData('patient-records', mergedRecords);

      if (remoteData.patientMap) {
        await saveData('patient-id-map', remoteData.patientMap);
      }
    }

    function updateSyncStatus(status, text) {
      const indicator = document.getElementById('sync-indicator');
      const syncText = document.getElementById('sync-text');
      indicator.className = 'sync-indicator ' + status;
      syncText.textContent = text;
    }

    async function manualSync() {
      await GoogleDriveSync.downloadData();
      setTimeout(() => {
        GoogleDriveSync.uploadData();
      }, 1000);
    }

    setInterval(() => {
      if (GoogleDriveSync.isSignedIn()) {
        GoogleDriveSync.downloadData();
      }
    }, 300000);

    const CORRECT_PIN = '258411';
    const AUTO_LOGOUT_TIME = 15 * 60 * 1000;
    let currentUser = null;
    let searchActive = false;
    let editingRecordId = null;
    let inactivityTimer = null;
    let lastActivityTime = Date.now();

    function resetInactivityTimer() {
      lastActivityTime = Date.now();

      if (inactivityTimer) {
        clearTimeout(inactivityTimer);
      }

      if (currentUser) {
        inactivityTimer = setTimeout(() => {
          autoLogout();
        }, AUTO_LOGOUT_TIME);
      }
    }

    function autoLogout() {
      if (currentUser) {
        showWarningMessage('⚠ Session expired due to inactivity. Please login again.');
        setTimeout(() => {
          logout(true);
        }, 2000);
      }
    }

    function setupActivityListeners() {
      const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'];

      events.forEach(event => {
        document.addEventListener(event, () => {
          if (currentUser) {
            resetInactivityTimer();
          }
        }, true);
      });
    }

    async function getOrCreatePatientId(patientName) {
      const patientMap = await loadData('patient-id-map');
      const existing = patientMap.find(p => p.name === patientName);
      if (existing) {
        return existing.id;
      }
      const newId = 'MED-' + Date.now().toString().slice(-8);
      patientMap.push({ name: patientName, id: newId });
      await saveData('patient-id-map', patientMap);
      return newId;
    }

    async function getPatientNames() {
      const patientMap = await loadData('patient-id-map');
      return patientMap.map(p => p.name);
    }

    async function updatePatientNameSuggestions() {
      const names = await getPatientNames();
      const datalist = document.getElementById('patient-names-list');
      datalist.innerHTML = names.map(name => `<option value="${name}">`).join('');
    }

    function login() {
      const name = document.getElementById('login-name').value.trim();
      const pin = document.getElementById('login-pin').value.trim();
      if (!name) {
        showLoginError('Please enter your full name');
        return;
      }
      if (pin !== CORRECT_PIN) {
        showLoginError('Invalid PIN. Access denied.');
        return;
      }
      currentUser = name;
      if (typeof AndroidStorage !== 'undefined') {
        AndroidStorage.setItem('medvault_user', name);
      } else {
        localStorage.setItem('medvault_user', name);
      }
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('user-info').textContent = `Logged in as: ${name}`;

      initVoiceRecognition();

      // Initialize autocomplete - diagnosis only (medicines autocomplete removed)
      handleAutocomplete('diagnosis', commonDiagnoses);

      if (!GoogleDriveSync.isSignedIn()) {
        setTimeout(() => {
          if (confirm('Connect to Google Drive for multi-user sync?')) {
            GoogleDriveSync.signIn();
          } else {
            updateSyncStatus('offline', 'Working offline only');
          }
        }, 500);
      }

      loadRecords();
      updatePatientNameSuggestions();
      resetInactivityTimer();

      if (GoogleDriveSync.isSignedIn()) {
        GoogleDriveSync.downloadData();
      }
    }

    function logout(isAutoLogout = false) {
      if (isAutoLogout) {
        performLogout();
      } else {
        showLogoutConfirmation();
      }
    }

    function showLogoutConfirmation() {
      const confirmMsg = document.getElementById('warning-message');
      confirmMsg.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>Are you sure you want to logout?</span>
          <div>
            <button class="btn btn-secondary btn-small" onclick="cancelLogout()" style="margin-right: 0.5rem;">Cancel</button>
            <button class="btn btn-primary btn-small" onclick="confirmLogout()">Logout</button>
          </div>
        </div>
      `;
      confirmMsg.classList.add('show');
    }

    function cancelLogout() {
      const confirmMsg = document.getElementById('warning-message');
      confirmMsg.classList.remove('show');
    }

    function confirmLogout() {
      const confirmMsg = document.getElementById('warning-message');
      confirmMsg.classList.remove('show');
      performLogout();
    }

    function performLogout() {
      if (inactivityTimer) {
        clearTimeout(inactivityTimer);
        inactivityTimer = null;
      }

      currentUser = null;
      if (typeof AndroidStorage !== 'undefined') {
        AndroidStorage.removeItem('medvault_user');
      } else {
        localStorage.removeItem('medvault_user');
      }
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('login-name').value = '';
      document.getElementById('login-pin').value = '';
    }

    function showLoginError(message) {
      const errorDiv = document.getElementById('login-error');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => errorDiv.classList.remove('show'), 3000);
    }

    function showSuccessMessage(message) {
      const successDiv = document.getElementById('success-message');
      successDiv.textContent = message;
      successDiv.classList.add('show');
      setTimeout(() => successDiv.classList.remove('show'), 3000);
    }

    function showWarningMessage(message) {
      const warningDiv = document.getElementById('warning-message');
      warningDiv.textContent = message;
      warningDiv.classList.add('show');
      setTimeout(() => warningDiv.classList.remove('show'), 3000);
    }

    function showAddForm() {
      editingRecordId = null;
      document.getElementById('modal-title').textContent = 'Add Patient Record';
      document.getElementById('patient-form').reset();
      // Safe call - check if function exists
      if (typeof clearSelectedFiles === 'function') {
        clearSelectedFiles();
      }
      document.getElementById('patient-modal').classList.add('show');
    }

    async function editRecord(recordId) {
      const records = await loadData('patient-records');
      const record = records.find(r => r.id === recordId);

      if (!record) {
        showWarningMessage('Record not found');
        return;
      }

      editingRecordId = recordId;
      document.getElementById('modal-title').textContent = 'Edit Patient Record';
      document.getElementById('patient-name').value = record.patientName;
      document.getElementById('phone-number').value = record.phoneNumber || '';
      document.getElementById('date-of-visit').value = record.dateOfVisit;
      document.getElementById('diagnosis').value = record.diagnosis;
      document.getElementById('medicines').value = record.medicines || '';

      // Safe call - check if function exists
      if (typeof loadSelectedFiles === 'function') {
        loadSelectedFiles(record.reports || []);
      }

      document.getElementById('patient-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('patient-modal').classList.remove('show');
      // Safe call - check if function exists
      if (typeof clearSelectedFiles === 'function') {
        clearSelectedFiles();
      }
      editingRecordId = null;
      stopVoiceInput();
    }

    function isWithinLast15Days(dateString) {
      const recordDate = new Date(dateString);
      const fifteenDaysAgo = new Date();
      fifteenDaysAgo.setDate(fifteenDaysAgo.getDate() - 15);
      return recordDate >= fifteenDaysAgo;
    }

    function searchRecords() {
      const searchTerm = document.getElementById('search-input').value.trim();
      if (!searchTerm) {
        alert('Please enter a patient name, ID, or phone number to search');
        return;
      }
      searchActive = true;
      loadRecords();
    }

    function clearSearch() {
      searchActive = false;
      document.getElementById('search-input').value = '';
      loadRecords();
    }

    async function saveData(key, data) {
      try {
        await window.storage.set(key, JSON.stringify(data));
      } catch (error) {
        console.error('Error saving data:', error);
        alert('Failed to save data. Please try again.');
      }
    }

    async function loadData(key) {
      try {
        const result = await window.storage.get(key);
        return result ? JSON.parse(result.value) : [];
      } catch (error) {
        return [];
      }
    }

    async function deleteData(key, id) {
      const data = await loadData(key);
      const filtered = data.filter(item => item.id !== id);
      await saveData(key, filtered);
    }

    async function savePatientRecord(event) {
      event.preventDefault();
      const patientName = document.getElementById('patient-name').value.trim();
      const phoneNumber = document.getElementById('phone-number').value.trim();
      const dateOfVisit = document.getElementById('date-of-visit').value;
      const diagnosis = document.getElementById('diagnosis').value.trim();
      const medicines = document.getElementById('medicines').value.trim();

      if (!patientName || !phoneNumber || !dateOfVisit || !diagnosis) {
        alert('Please fill in all required fields');
        return;
      }

      const patientId = await getOrCreatePatientId(patientName);

      // Safe call - check if function exists
      const status = (typeof calculateStatus === 'function') ? calculateStatus(medicines) : (medicines ? 'Complete' : 'In Progress');

      // Safe call - check if function exists
      let reports = [];
      if (typeof getSelectedFiles === 'function') {
        reports = getSelectedFiles().length > 0 ? getSelectedFiles() : (editingRecordId ? (await loadData('patient-records')).find(r => r.id === editingRecordId)?.reports || [] : []);
      }

      const record = {
        id: editingRecordId || Date.now(),
        patientName,
        patientId,
        phoneNumber,
        dateOfVisit,
        diagnosis,
        medicines: medicines || '',
        reports: reports,
        status: status,
        timestamp: new Date().toISOString()
      };

      const records = await loadData('patient-records');
      if (editingRecordId) {
        const index = records.findIndex(r => r.id === editingRecordId);
        if (index !== -1) {
          records[index] = record;
          showSuccessMessage(`✓ Record for ${patientName} updated successfully!`);
        }
      } else {
        records.push(record);
        showSuccessMessage(`✓ Record for ${patientName} saved successfully!`);
      }

      await saveData('patient-records', records);
      await updatePatientNameSuggestions();

      // Safe call - check if function exists
      if (typeof clearSelectedFiles === 'function') {
        clearSelectedFiles();
      }
      closeModal();

      if (searchActive) {
        clearSearch();
      } else {
        loadRecords();
      }

      if (GoogleDriveSync.isSignedIn()) {
        setTimeout(() => GoogleDriveSync.uploadData(), 500);
      }
    }

    async function loadRecords() {
      const allRecords = await loadData('patient-records');
      const searchTerm = document.getElementById('search-input').value.trim();

      let records;
      if (searchActive && searchTerm) {
        records = allRecords.filter(r =>
          r.patientName.toLowerCase().includes(searchTerm.toLowerCase()) ||
          r.patientId.toLowerCase().includes(searchTerm.toLowerCase()) ||
          (r.phoneNumber && r.phoneNumber.includes(searchTerm))
        );
      } else if (!searchActive) {
        records = allRecords.filter(r => isWithinLast15Days(r.dateOfVisit));
      } else {
        records = allRecords;
      }

      const tbody = document.getElementById('records-body');
      if (records.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">
              ${searchActive ? 'No matching records found for "' + searchTerm + '"' : 'No records in the last 15 days. Click "Show All" or use search to see older records.'}
            </td>
          </tr>
        `;
        return;
      }

      records.sort((a, b) => new Date(b.dateOfVisit) - new Date(a.dateOfVisit));

      tbody.innerHTML = records.map(record => `
        <tr class="record-row" onclick="viewRecordDetails(${record.id})" style="cursor: pointer;">
          <td style="text-align: center;">
            <span style="font-size: 1.5rem;">📋</span>
          </td>
          <td>${record.patientName}</td>
          <td>${record.phoneNumber || 'N/A'}</td>
          <td>${new Date(record.dateOfVisit).toLocaleDateString()}</td>
          <td onclick="event.stopPropagation()">
            <div class="actions-cell">
              <button class="btn btn-primary btn-small" onclick="editRecord(${record.id})" title="Edit record">✏️</button>
              <button class="btn btn-secondary btn-small" onclick="deleteRecord(${record.id})" title="Delete record">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function viewRecordDetails(id) {
      const allRecords = await loadData('patient-records');
      const record = allRecords.find(r => r.id === id);
      if (!record) return;

      const fields = [
        { label: 'Patient Name', value: record.patientName },
        { label: 'Phone Number', value: record.phoneNumber || 'N/A' },
        { label: 'Date of Visit', value: new Date(record.dateOfVisit).toLocaleDateString() },
        { label: 'Diagnosis', value: record.diagnosis || 'N/A' },
        { label: 'Medicine', value: record.medicines || 'Not prescribed yet' },
        { label: 'Status', value: record.status || 'In Progress' },
        { label: 'Reports', value: record.reports && record.reports.length > 0 ? record.reports.length + ' file(s)' : 'No reports' },
      ];

      document.getElementById('detail-body').innerHTML = fields.map(f => `
        <div class="detail-field">
          <span class="detail-field-label">${f.label}</span>
          <span class="detail-field-value">${f.value}</span>
        </div>
      `).join('');

      document.getElementById('detail-edit-btn').onclick = () => {
        closeDetailModal();
        editRecord(id);
      };

      document.getElementById('detail-modal').classList.add('show');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.remove('show');
    }

    async function deleteRecord(id) {
      if (confirm('Are you sure you want to delete this record?')) {
        await deleteData('patient-records', id);
        showSuccessMessage('✓ Record deleted successfully!');
        loadRecords();
        
        if (GoogleDriveSync.isSignedIn()) {
          setTimeout(() => GoogleDriveSync.uploadData(), 500);
        }
      }
    }

    // Medical Autocomplete Data
    const commonDiagnoses = [
      { name: "Hypertension", category: "Cardiovascular" },
      { name: "Type 2 Diabetes Mellitus", category: "Endocrine" },
      { name: "Type 1 Diabetes Mellitus", category: "Endocrine" },
      { name: "Asthma", category: "Respiratory" },
      { name: "COPD (Chronic Obstructive Pulmonary Disease)", category: "Respiratory" },
      { name: "Pneumonia", category: "Respiratory" },

      { name: "Pharyngitis", category: "Respiratory" }
    ];

    // Autocomplete functionality
    let selectedSuggestionIndex = -1;
    let currentSuggestions = [];
    let currentField = null;

    function showSuggestions(fieldId, suggestions) {
      const suggestionsDiv = document.getElementById(fieldId + '-suggestions');
      if (!suggestionsDiv) return;

      if (suggestions.length === 0) {
        suggestionsDiv.classList.remove('show');
        return;
      }

      currentSuggestions = suggestions;
      selectedSuggestionIndex = -1;

      suggestionsDiv.innerHTML = suggestions.map((item, index) => `
        <div class="autocomplete-suggestion" data-index="${index}" onclick="selectSuggestion('${fieldId}', ${index})">
          <div>${highlightMatch(item.name, document.getElementById(fieldId).value)}</div>
          <div class="autocomplete-category">${item.category}</div>
        </div>
      `).join('');

      suggestionsDiv.classList.add('show');
    }

    function highlightMatch(text, query) {
      if (!query) return text;
      const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
      return text.replace(regex, '<span class="autocomplete-match">$1</span>');
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function selectSuggestion(fieldId, index) {
      const field = document.getElementById(fieldId);
      const suggestionsDiv = document.getElementById(fieldId + '-suggestions');
      
      if (index >= 0 && index < currentSuggestions.length) {
        field.value = currentSuggestions[index].name;
        suggestionsDiv.classList.remove('show');
        field.focus();
      }
    }

    function handleAutocomplete(fieldId, dataList) {
      const field = document.getElementById(fieldId);
      if (!field) return;

      field.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();
        
        if (query.length < 2) {
          const suggestionsDiv = document.getElementById(fieldId + '-suggestions');
          if (suggestionsDiv) suggestionsDiv.classList.remove('show');
          return;
        }

        const matches = dataList.filter(item => 
          item.name.toLowerCase().includes(query)
        ).slice(0, 8);

        showSuggestions(fieldId, matches);
      });

      field.addEventListener('keydown', function(e) {
        const suggestionsDiv = document.getElementById(fieldId + '-suggestions');
        if (!suggestionsDiv || !suggestionsDiv.classList.contains('show')) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, currentSuggestions.length - 1);
          updateSelectedSuggestion(fieldId);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
          updateSelectedSuggestion(fieldId);
        } else if (e.key === 'Enter' && selectedSuggestionIndex >= 0) {
          e.preventDefault();
          selectSuggestion(fieldId, selectedSuggestionIndex);
        } else if (e.key === 'Escape') {
          suggestionsDiv.classList.remove('show');
        }
      });

      document.addEventListener('click', function(e) {
        if (!e.target.closest('.autocomplete-container')) {
          const suggestionsDiv = document.getElementById(fieldId + '-suggestions');
          if (suggestionsDiv) suggestionsDiv.classList.remove('show');
        }
      });
    }

    function updateSelectedSuggestion(fieldId) {
      const suggestionsDiv = document.getElementById(fieldId + '-suggestions');
      const suggestions = suggestionsDiv.querySelectorAll('.autocomplete-suggestion');
      
      suggestions.forEach((suggestion, index) => {
        if (index === selectedSuggestionIndex) {
          suggestion.classList.add('selected');
          suggestion.scrollIntoView({ block: 'nearest' });
        } else {
          suggestion.classList.remove('selected');
        }
      });
    }
    
    window.addEventListener('load', () => {
      setupActivityListeners();
      
      let savedUser;
      if (typeof AndroidStorage !== 'undefined') {
        savedUser = AndroidStorage.getItem('medvault_user');
      } else {
        savedUser = localStorage.getItem('medvault_user');
      }
      
      if (savedUser) {
        currentUser = savedUser;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('user-info').textContent = `Logged in as: ${savedUser}`;
        
        initVoiceRecognition();
        resetInactivityTimer();
        
        updateSyncStatus('offline', 'Checking connection...');
        loadRecords();
        updatePatientNameSuggestions();
        
        setTimeout(() => {
          if (GoogleDriveSync.isSignedIn()) {
            GoogleDriveSync.downloadData();
          } else {
            updateSyncStatus('offline', 'Working offline - Click to sync');
          }
        }, 1000);
      }

      document.getElementById('login-pin').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
      });
      
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchRecords();
      });
    });
